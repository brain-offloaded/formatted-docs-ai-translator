name: Package (Windows ZIP)

on:
  workflow_dispatch:

jobs:
  prepare-release-tag:
    name: Prepare release tag
    if: startsWith(github.ref_name, 'release/v')
    runs-on: windows-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ secrets.GH_TOKEN }}
    outputs:
      release-version: ${{ steps.release.outputs.release-version }}
      tag-exists: ${{ steps.release.outputs.tag-exists }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}

      - name: Prepare release tag
        id: release
        shell: bash
        env:
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if [[ "$REF_NAME" =~ ^release/(v[0-9]+\.[0-9]+\.[0-9]+)$ ]]; then
            VERSION="${BASH_REMATCH[1]}"
          else
            echo "::error::release/vx.y.z 브랜치에서만 실행할 수 있습니다. 현재 ref: $REF_NAME"
            exit 1
          fi
          TAG_EXISTS=false
          CREATE_RELEASE=false
          if git ls-remote --exit-code --tags origin "$VERSION" >/dev/null; then
            TAG_EXISTS=true
          else
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git tag -a "$VERSION" -m "Release $VERSION"
            git push origin "$VERSION"
            CREATE_RELEASE=true
          fi
          if [ "$CREATE_RELEASE" = "true" ]; then
            if gh release view "$VERSION" >/dev/null 2>&1; then
              gh release delete "$VERSION" --yes
            fi
            gh release create "$VERSION" --draft --title "$VERSION" --notes "자동 생성된 드래프트 릴리스"
          fi
          echo "release-version=$VERSION" >> $GITHUB_OUTPUT
          echo "tag-exists=$TAG_EXISTS" >> $GITHUB_OUTPUT

  delete-release-tag:
    name: Recreate release tag (approval required)
    needs: prepare-release-tag
    if: startsWith(github.ref_name, 'release/v') && needs.prepare-release-tag.outputs.tag-exists == 'true'
    runs-on: windows-latest
    permissions:
      contents: write
    environment: release-tag-approval
    env:
      GH_TOKEN: ${{ secrets.GH_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}

      - name: Recreate release tag
        shell: bash
        env:
          VERSION: ${{ needs.prepare-release-tag.outputs.release-version }}
        run: |
          set -euo pipefail
          if gh release view "$VERSION" >/dev/null 2>&1; then
            gh release delete "$VERSION" --yes
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag --delete "$VERSION" >/dev/null 2>&1 || true
          git push origin --delete "$VERSION" >/dev/null 2>&1 || true
          git tag -a "$VERSION" -m "Release $VERSION"
          git push origin "$VERSION"
          gh release create "$VERSION" --draft --title "$VERSION" --notes "자동 생성된 드래프트 릴리스"

  build-zip:
    name: Package (Windows ZIP)
    needs: prepare-release-tag
    if: startsWith(github.ref_name, 'release/v') && needs.prepare-release-tag.outputs.tag-exists == 'false'
    runs-on: windows-latest
    permissions:
      contents: write
    env:
      YARN_ENABLE_IMMUTABLE_INSTALLS: "true"
      npm_config_loglevel: notice
      GH_TOKEN: ${{ secrets.GH_TOKEN }}
    steps: &package-steps
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: 'package.json'

      - name: Enable Corepack
        run: corepack enable

      - name: Use Yarn 4.9.2 via Corepack
        run: corepack prepare yarn@4.9.2 --activate

      - name: Show Node/Yarn versions
        run: |
          node -v
          yarn -v

      - name: Cache Yarn
        uses: actions/cache@v4
        with:
          path: |
            .yarn/cache
            .yarn/install-state.gz
            .pnp.cjs
          key: yarn-${{ runner.os }}-${{ hashFiles('**/yarn.lock') }}
          restore-keys: |
            yarn-${{ runner.os }}-

      - name: Cache tools (electron/prisma)
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/electron
            ~/.cache/electron-builder
            ~/.cache/prisma
          key: tools-${{ runner.os }}-${{ hashFiles('**/yarn.lock') }}
          restore-keys: |
            tools-${{ runner.os }}-

      - name: Allow long paths (Windows)
        run: git config --system core.longpaths true

      - name: Normalize artifact ref
        id: artifact-ref
        shell: bash
        env:
          REF: ${{ needs.prepare-release-tag.outputs.release-version || github.ref_name }}
        run: |
          REF=${REF:-manual}
          REF=${REF//\//-}
          echo "artifact-ref=$REF" >> $GITHUB_OUTPUT

      - name: Install deps
        run: yarn install --immutable

      - name: Validate i18n resources
        run: yarn validate:i18n

      - name: Package (Windows ZIP)
        run: yarn package:win:dist

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: formatted-docs-ai-translator-win-${{ steps.artifact-ref.outputs.artifact-ref }}
          path: |
            release/**/*.zip
            release/**/builder-*.yml
            release/**/builder-*.yaml
          if-no-files-found: warn

      - name: Upload assets to draft release
        shell: bash
        env:
          VERSION: ${{ needs.prepare-release-tag.outputs.release-version }}
        run: |
          set -euo pipefail
          if [ -z "$VERSION" ]; then
            echo "::error::릴리스 버전을 확인할 수 없습니다."
            exit 1
          fi
          mapfile -d '' -t FILES < <(find release -type f \( -name '*.zip' -o -name 'builder-*.yml' -o -name 'builder-*.yaml' \) -print0 | sort -z)
          if [ "${#FILES[@]}" -eq 0 ]; then
            echo "::error::릴리스에 업로드할 파일을 찾을 수 없습니다."
            exit 1
          fi
          if ! gh release view "$VERSION" >/dev/null 2>&1; then
            echo "::error::$VERSION 태그의 드래프트 릴리스를 찾을 수 없습니다."
            exit 1
          fi
          gh release upload "$VERSION" "${FILES[@]}" --clobber

  build-zip-after-approval:
    name: Package (Windows ZIP)
    needs:
      - prepare-release-tag
      - delete-release-tag
    if: startsWith(github.ref_name, 'release/v') && needs.prepare-release-tag.outputs.tag-exists == 'true'
    runs-on: windows-latest
    permissions:
      contents: write
    env:
      YARN_ENABLE_IMMUTABLE_INSTALLS: "true"
      npm_config_loglevel: notice
      GH_TOKEN: ${{ secrets.GH_TOKEN }}
    steps: *package-steps
