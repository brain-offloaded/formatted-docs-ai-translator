name: Package (Windows ZIP)

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: '릴리스 태그 (예: v1.2.3)'
        required: true
        type: string

jobs:
  build-zip:
    name: Package (Windows ZIP)
    runs-on: windows-latest
    permissions:
      contents: write
    env:
      YARN_ENABLE_IMMUTABLE_INSTALLS: 'true'
      npm_config_loglevel: notice
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate release tag
        id: release
        shell: bash
        env:
          TAG_INPUT: ${{ github.event.inputs.release_tag }}
        run: |
          set -euo pipefail
          TAG="$(echo "$TAG_INPUT" | tr -d '[:space:]')"
          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::유효한 태그 형식이 아닙니다. 예: v1.2.3 (입력값: $TAG_INPUT)"
            exit 1
          fi
          if ! git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null; then
            echo "::error::원격 저장소에 태그 $TAG 가 없습니다. 먼저 태그를 발행하세요."
            exit 1
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "tag-ref=refs/tags/$TAG" >> "$GITHUB_OUTPUT"

      - name: Checkout tag
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.release.outputs.tag-ref }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: package.json

      - name: Enable Corepack
        run: corepack enable

      - name: Use Yarn 4.9.2 via Corepack
        run: corepack prepare yarn@4.9.2 --activate

      - name: Show Node/Yarn versions
        run: |
          node -v
          yarn -v

      - name: Cache Yarn
        uses: actions/cache@v4
        with:
          path: |
            .yarn/cache
            .yarn/install-state.gz
            .pnp.cjs
          key: yarn-${{ runner.os }}-${{ hashFiles('**/yarn.lock') }}
          restore-keys: |
            yarn-${{ runner.os }}-

      - name: Cache tools (electron/prisma)
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/electron
            ~/.cache/electron-builder
            ~/.cache/prisma
          key: tools-${{ runner.os }}-${{ hashFiles('**/yarn.lock') }}
          restore-keys: |
            tools-${{ runner.os }}-

      - name: Allow long paths (Windows)
        run: git config --system core.longpaths true

      - name: Ensure draft release exists
        shell: bash
        env:
          TAG: ${{ steps.release.outputs.tag }}
        run: |
          set -euo pipefail
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG exists. Reusing current release."
          else
            gh release create "$TAG" --draft --title "$TAG" --notes "자동 생성된 드래프트 릴리스"
          fi

      - name: Install deps
        run: yarn install --immutable

      - name: Validate i18n resources
        run: yarn validate:i18n

      - name: Package (Windows ZIP)
        run: yarn package:win:dist

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: formatted-docs-ai-translator-win-${{ steps.release.outputs.tag }}
          path: |
            release/**/*.zip
            release/**/builder-*.yml
            release/**/builder-*.yaml
          if-no-files-found: warn

      - name: Upload assets to release
        shell: bash
        env:
          TAG: ${{ steps.release.outputs.tag }}
        run: |
          set -euo pipefail
          mapfile -d '' -t FILES < <(find release -type f \( -name '*.zip' -o -name 'builder-*.yml' -o -name 'builder-*.yaml' \) -print0 | sort -z)
          if [ "${#FILES[@]}" -eq 0 ]; then
            echo "::error::릴리스에 업로드할 파일을 찾을 수 없습니다."
            exit 1
          fi
          gh release upload "$TAG" "${FILES[@]}" --clobber
